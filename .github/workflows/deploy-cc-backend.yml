name: Deploy CC Backend (Staging)

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/deploy-cc-backend.yml'

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: acrstudojo-dhfsdrfhf6a6bbg2.azurecr.io
  ACR_NAME: acrstudojo
  APP_NAME: cc-backend
  NAMESPACE: staging
  AKS_RG: rg-studojo
  AKS_CLUSTER: studojo-aks

jobs:
  deploy-cc-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CC backend source
        uses: actions/checkout@v4
        with:
          repository: Studojo1/Career-coach
          token: ${{ secrets.CC_DEPLOY_TOKEN }}
          ref: main
          path: cc-source

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          TOKEN=$(az acr login --name ${{ env.ACR_NAME }} --expose-token --output tsv --query accessToken)
          docker login ${{ env.REGISTRY }} -u 00000000-0000-0000-0000-000000000000 -p "$TOKEN"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./cc-source/backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.APP_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.APP_NAME }}:staging-latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.APP_NAME }}:buildcache-staging
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.APP_NAME }}:buildcache-staging,mode=max

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AKS_RG }} \
            --name ${{ env.AKS_CLUSTER }} \
            --overwrite-existing

      - name: Bootstrap namespace
        run: |
          kubectl get namespace ${{ env.NAMESPACE }} 2>/dev/null \
            || kubectl create namespace ${{ env.NAMESPACE }}

      - name: Bootstrap secrets
        run: |
          kubectl create secret generic cc-backend-secrets \
            --namespace ${{ env.NAMESPACE }} \
            --from-literal=AZURE_OPENAI_API_KEY="${{ secrets.CC_AZURE_OPENAI_API_KEY }}" \
            --from-literal=AZURE_OPENAI_ENDPOINT="${{ secrets.CC_AZURE_OPENAI_ENDPOINT }}" \
            --from-literal=DATABASE_URL="sqlite+aiosqlite:///./studojo.db" \
            --from-literal=ADMIN_SECRET_KEY="${{ secrets.CC_ADMIN_SECRET_KEY }}" \
            --save-config \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply service and ingress
        run: |
          kubectl apply -f cc-source/backend/k8s/service.yaml
          kubectl apply -f cc-source/backend/k8s/ingress-staging.yaml

      - name: Deploy updated image
        run: |
          sed "s|IMAGE_TAG|${{ github.sha }}|g" cc-source/backend/k8s/deployment-staging.yaml \
            | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ env.APP_NAME }} \
            -n ${{ env.NAMESPACE }} --timeout=8m || {
            kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.APP_NAME }} -o wide
            LATEST=$(kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.APP_NAME }} \
              --sort-by=.metadata.creationTimestamp \
              -o jsonpath='{.items[-1].metadata.name}' 2>/dev/null || true)
            [ -n "$LATEST" ] && kubectl logs -n ${{ env.NAMESPACE }} "$LATEST" --tail=50 || true
            exit 1
          }

      - name: Confirm deployment
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.APP_NAME }}
          echo "CC backend live at https://studojo.pro/api/v1/cc/health"
