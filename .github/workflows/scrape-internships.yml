name: Scrape Internships

on:
  schedule:
    # Runs daily at 05:00 UTC (10:30 IST, 22:00 PST)
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: false
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  scrape:
    name: Scrape and ingest internships
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger scrape — staging
        if: github.event.inputs.environment != 'production'
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://studojo.pro/api/admin/scrape-internships" \
            -H "Authorization: Bearer ${{ secrets.SCRAPE_SECRET }}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "HTTP $HTTP_CODE"
          echo "$BODY" | python3 -m json.tool || echo "$BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Scrape failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Trigger scrape — production
        if: github.event.inputs.environment == 'production'
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://studojo.com/api/admin/scrape-internships" \
            -H "Authorization: Bearer ${{ secrets.SCRAPE_SECRET }}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "HTTP $HTTP_CODE"
          echo "$BODY" | python3 -m json.tool || echo "$BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Scrape failed with HTTP $HTTP_CODE"
            exit 1
          fi
