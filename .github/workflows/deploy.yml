name: Build and Deploy

on:
  push:
    branches: [main]

# Two merges a minute apart used to run two deploys at once, and the older
# build could finish last and go live. The newest push wins now.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: acrstudojo-dhfsdrfhf6a6bbg2.azurecr.io
  ACR_NAME: acrstudojo
  APP_NAME: frontend
  IMAGE_TAG: ${{ github.sha }}
  NAMESPACE: studojo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          TOKEN=$(az acr login --name ${{ env.ACR_NAME }} --expose-token --output tsv --query accessToken)
          docker login ${{ env.REGISTRY }} -u 00000000-0000-0000-0000-000000000000 -p "$TOKEN"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.APP_NAME }}:latest
          build-args: |
            VITE_PUBLIC_POSTHOG_KEY=${{ secrets.POSTHOG_KEY }}
            VITE_CONTEXT_LOGO_CLIENT_ID=${{ vars.VITE_CONTEXT_LOGO_CLIENT_ID }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.APP_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.APP_NAME }}:buildcache,mode=max

      - name: Build and push migrate image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: db-push
          tags: |
            ${{ env.REGISTRY }}/${{ env.APP_NAME }}-migrate:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.APP_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.APP_NAME }}:buildcache,mode=max

  migrate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      # The AKS API server can be firewalled with authorized IP ranges. These
      # runners are GitHub-hosted with ephemeral IPs, so there is no fixed
      # address to allowlist ahead of time: grant this run's egress IP, then
      # revoke it in a final always() step. No-ops when the cluster has no IP
      # restriction configured, so it is safe either way.
      - name: Allow this runner through the AKS API server firewall
        id: aks_allow
        run: |
          set -euo pipefail
          CURRENT=$(az aks show -g rg-studojo -n studojo-aks \
            --query "apiServerAccessProfile.authorizedIpRanges" -o tsv | paste -sd, -)
          if [ -z "$CURRENT" ]; then
            echo "No authorized IP ranges configured; nothing to do."
            echo "modified=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RUNNER_IP=$(curl -fsS --retry 3 https://api.ipify.org)
          echo "Runner egress IP: $RUNNER_IP"
          echo "original=$CURRENT" >> "$GITHUB_OUTPUT"
          if printf '%s' "$CURRENT" | tr ',' '\n' | grep -qx "$RUNNER_IP/32"; then
            echo "Already allowed."
            echo "modified=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          az aks update -g rg-studojo -n studojo-aks \
            --api-server-authorized-ip-ranges "$CURRENT,$RUNNER_IP/32" \
            --only-show-errors -o none
          echo "modified=true" >> "$GITHUB_OUTPUT"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group rg-studojo \
            --name studojo-aks \
            --overwrite-existing

      - name: Secrets as secretKeyRef (audit ST-N07)
        env:
          EMAILER_INTERNAL_SECRET: ${{ secrets.EMAILER_INTERNAL_SECRET }}
          BOB_MCP_SECRET: ${{ secrets.BOB_MCP_SECRET }}
          META_CAPI_TOKEN: ${{ secrets.META_CAPI_TOKEN }}
        run: |
          # Every secret lives in app-secrets and reaches the pod through
          # secretKeyRef, never as a literal value in the Deployment spec, where
          # anyone who can read Deployments or old ReplicaSets sees it.
          # scripts/ci/secret_env.sh explains; scripts/ci/check_no_literal_secrets.sh
          # fails CI if a workflow writes one back.
          export NS=${{ env.NAMESPACE }} DEP=${{ env.APP_NAME }}
          . scripts/ci/secret_env.sh
          # GitHub secrets are stored in app-secrets (an empty one changes nothing,
          # so a working value is never blanked), then referenced.
          #  - EMAILER_INTERNAL_SECRET: the emailer's gated routes (event
          #    publishing); the emailer reads the same app-secrets key.
          #  - BOB_MCP_SECRET: Sensei MCP gateway secret (== bob-svc
          #    BOB_GATEWAY_SECRET). Unset = the MCP's Sensei tools stay off.
          #  - META_CAPI_TOKEN: server-side half of the Meta Pixel
          #    (app/lib/meta-capi.server.ts). Unset = only the browser copy is sent.
          secret_put emailer-internal-secret "$EMAILER_INTERNAL_SECRET"
          secret_put bob-gateway-secret "$BOB_MCP_SECRET"
          secret_put meta-capi-token "$META_CAPI_TOKEN"
          secret_adopt EMAILER_INTERNAL_SECRET emailer-internal-secret
          secret_adopt BOB_MCP_SECRET bob-gateway-secret
          secret_adopt META_CAPI_TOKEN meta-capi-token
          # Keys that were set by hand on the Deployment: adopted into app-secrets
          # once (current value kept), referenced from then on.
          secret_adopt API_KEY_PEPPER api-key-pepper
          secret_adopt APOLLO_API_KEY apollo-api-key
          secret_adopt APOLLO_WEBHOOK_SECRET apollo-webhook-secret
          secret_adopt SALESQL_API_KEY salesql-api-key
          secret_adopt LEADSFORGE_API_KEY leadsforge-api-key
          # Career Coach / job-outreach-svc internal header (audit G1).
          secret_ref INTERNAL_API_SECRET INTERNAL_API_SECRET
          secret_audit

      - name: Non-secret runtime env
        run: |
          # Reach the emailer in-cluster. Unset, app/lib/events.ts falls back to
          # the public https://email.studojo.com, whose ingress no longer routes
          # /v1/email/events or /v1/email/send-template (audit AS-N02).
          # BOB_INTERNAL_URL is in-cluster DNS (bypasses the ingress); BOB_ENV
          # scopes each Sensei MCP API key's workspace mapping to THIS environment.
          kubectl set env deployment/${{ env.APP_NAME }} -n ${{ env.NAMESPACE }} \
            EMAILER_SERVICE_URL="http://emailer-service:8087" \
            BOB_INTERNAL_URL="http://bob-svc:8000" \
            BOB_ENV="prod"

      - name: Configure Razorpay (webinar ticketing)
        run: |
          # Server-side Razorpay credentials for webinar ticket sales
          # (app/lib/razorpay.server.ts). The webinar page takes payments from
          # people with no Studojo account, so it creates orders directly rather
          # than going through the auth-gated control-plane endpoint.
          #
          # Sourced from the cluster's app-secrets rather than GitHub secrets:
          # the same live keys job-outreach-svc uses already live there, and
          # referencing them keeps one copy of the credential. They are wired as
          # secretKeyRef, not literal values, so the key never appears in a
          # deployment spec or in this job's logs.
          #
          # razorpay-mode selects which key pair is live. Anything other than
          # "production" uses the test keys, so a staging cluster cannot take
          # real money.
          MODE=$(kubectl get secret app-secrets -n ${{ env.NAMESPACE }} \
            -o jsonpath='{.data.razorpay-mode}' | base64 -d 2>/dev/null || echo "test")
          if [ "$MODE" = "production" ]; then
            ID_KEY="razorpay-key-prod-id"; SECRET_KEY="razorpay-key-prod-secret"
          else
            ID_KEY="razorpay-key-test-id"; SECRET_KEY="razorpay-key-test-secret"
          fi
          echo "Razorpay mode: $MODE (using $ID_KEY)"
          # Written to a file rather than passed inline: a JSON document full of
          # quotes inside a shell string inside YAML is where this breaks.
          #
          # A strategic-merge patch on env is keyed by name, so re-running this
          # updates the three entries in place instead of appending duplicates
          # the way a JSON-patch "add" to /env/- would on every deploy.
          cat > /tmp/razorpay-env-patch.json <<PATCH
          {"spec":{"template":{"spec":{"containers":[{"name":"${{ env.APP_NAME }}","env":[
            {"name":"RAZORPAY_KEY_ID","valueFrom":{"secretKeyRef":{"name":"app-secrets","key":"$ID_KEY"}}},
            {"name":"RAZORPAY_KEY_SECRET","valueFrom":{"secretKeyRef":{"name":"app-secrets","key":"$SECRET_KEY"}}},
            {"name":"RAZORPAY_WEBHOOK_SECRET","valueFrom":{"secretKeyRef":{"name":"app-secrets","key":"razorpay-webhook-secret"}}}
          ]}]}}}}
          PATCH
          kubectl patch deployment/${{ env.APP_NAME }} -n ${{ env.NAMESPACE }} \
            --type=strategic --patch-file=/tmp/razorpay-env-patch.json

      - name: Apply schema migrations
        env:
          JOB_NAME: frontend-migrate-${{ github.run_id }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.APP_NAME }}-migrate:${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          echo "Running migration job: $JOB_NAME"
          echo "Image: $IMAGE"

          # Substitute placeholders and submit the Job.
          sed \
            -e "s|__JOB_NAME__|$JOB_NAME|g" \
            -e "s|__NAMESPACE__|${{ env.NAMESPACE }}|g" \
            -e "s|__IMAGE__|$IMAGE|g" \
            k8s/migrate-job.yaml | kubectl apply -f -

          # Poll the Job until it reaches a terminal state. We can't just use
          # `kubectl wait --for=condition=complete` because that returns
          # non-zero on timeout AND on failure with identical semantics, and
          # we want to surface failure logs distinctly.
          deadline=$(( $(date +%s) + 900 ))
          while [ $(date +%s) -lt $deadline ]; do
            succeeded=$(kubectl get job "$JOB_NAME" -n ${{ env.NAMESPACE }} -o jsonpath='{.status.succeeded}' 2>/dev/null || true)
            failed=$(kubectl get job "$JOB_NAME" -n ${{ env.NAMESPACE }} -o jsonpath='{.status.failed}' 2>/dev/null || true)

            if [ "$succeeded" = "1" ]; then
              echo "::group::Migration logs"
              kubectl logs "job/$JOB_NAME" -n ${{ env.NAMESPACE }} --tail=500 || true
              echo "::endgroup::"
              echo "Migrations succeeded."
              exit 0
            fi

            if [ -n "$failed" ] && [ "$failed" != "0" ]; then
              echo "::error::Migration job failed (failed=$failed). Deploy will not proceed."
              echo "::group::Migration logs"
              kubectl logs "job/$JOB_NAME" -n ${{ env.NAMESPACE }} --tail=500 || true
              echo "::endgroup::"
              exit 1
            fi

            sleep 5
          done

          echo "::error::Migration job did not finish within 15 minutes."
          echo "::group::Migration logs (timeout)"
          kubectl logs "job/$JOB_NAME" -n ${{ env.NAMESPACE }} --tail=500 || true
          echo "::endgroup::"
          exit 1
      # Always restore the original allowlist, even if earlier steps failed, so
      # a failed deploy can never leave the API server open to a stale runner IP.
      - name: Revoke this runner from the AKS API server firewall
        if: always() && steps.aks_allow.outputs.modified == 'true'
        run: |
          set -euo pipefail
          az aks update -g rg-studojo -n studojo-aks \
            --api-server-authorized-ip-ranges "${{ steps.aks_allow.outputs.original }}" \
            --only-show-errors -o none
          echo "Restored original authorized IP ranges."

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      # The AKS API server can be firewalled with authorized IP ranges. These
      # runners are GitHub-hosted with ephemeral IPs, so there is no fixed
      # address to allowlist ahead of time: grant this run's egress IP, then
      # revoke it in a final always() step. No-ops when the cluster has no IP
      # restriction configured, so it is safe either way.
      - name: Allow this runner through the AKS API server firewall
        id: aks_allow
        run: |
          set -euo pipefail
          CURRENT=$(az aks show -g rg-studojo -n studojo-aks \
            --query "apiServerAccessProfile.authorizedIpRanges" -o tsv | paste -sd, -)
          if [ -z "$CURRENT" ]; then
            echo "No authorized IP ranges configured; nothing to do."
            echo "modified=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RUNNER_IP=$(curl -fsS --retry 3 https://api.ipify.org)
          echo "Runner egress IP: $RUNNER_IP"
          echo "original=$CURRENT" >> "$GITHUB_OUTPUT"
          if printf '%s' "$CURRENT" | tr ',' '\n' | grep -qx "$RUNNER_IP/32"; then
            echo "Already allowed."
            echo "modified=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          az aks update -g rg-studojo -n studojo-aks \
            --api-server-authorized-ip-ranges "$CURRENT,$RUNNER_IP/32" \
            --only-show-errors -o none
          echo "modified=true" >> "$GITHUB_OUTPUT"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group rg-studojo \
            --name studojo-aks \
            --overwrite-existing

      - name: Ensure zero-downtime rollout strategy
        run: |
          # Surge a new pod up and wait for it to become ready BEFORE the old
          # pod is torn down. Without this (maxSurge=0/maxUnavailable=1) a
          # single-replica deploy has a no-ready-pod gap and nginx returns 503
          # for ~30s on every deploy. Idempotent: no-op once already set, and a
          # strategy-only patch does not by itself trigger a rollout.
          kubectl patch deployment/${{ env.APP_NAME }} -n ${{ env.NAMESPACE }} \
            --type=strategic \
            -p '{"spec":{"strategy":{"rollingUpdate":{"maxSurge":1,"maxUnavailable":0}}}}'

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/${{ env.APP_NAME }} \
            ${{ env.APP_NAME }}=${{ env.REGISTRY }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }} \
            -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/${{ env.APP_NAME }} \
            -n ${{ env.NAMESPACE }} --timeout=10m || {
            echo "Rollout failed or timed out. Checking pod status..."
            kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.APP_NAME }} -o wide
            LATEST_POD=$(kubectl get pods -n ${{ env.NAMESPACE }} \
              -l app=${{ env.APP_NAME }} \
              --sort-by=.metadata.creationTimestamp \
              -o jsonpath='{.items[-1].metadata.name}' 2>/dev/null || echo "")
            if [ -n "$LATEST_POD" ]; then
              kubectl get events -n ${{ env.NAMESPACE }} \
                --field-selector involvedObject.name=$LATEST_POD \
                --sort-by='.lastTimestamp' | tail -20 || true
              kubectl logs -n ${{ env.NAMESPACE }} $LATEST_POD --tail=50 || true
            fi
            exit 1
          }

      - name: Record deployment
        run: |
          curl -X POST https://api.studojo.com/v1/dev/deployments \
            -H "Content-Type: application/json" \
            -H "X-Deployment-Secret: ${{ secrets.DEPLOYMENT_SECRET }}" \
            -d '{
              "service": "${{ env.APP_NAME }}",
              "version": "${{ env.IMAGE_TAG }}",
              "deployed_at": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'",
              "deployed_by": "${{ github.actor }}",
              "status": "success",
              "workflow_run": ${{ github.run_id }}
            }' || echo "Failed to record deployment (non-critical)"
      # Always restore the original allowlist, even if earlier steps failed, so
      # a failed deploy can never leave the API server open to a stale runner IP.
      - name: Revoke this runner from the AKS API server firewall
        if: always() && steps.aks_allow.outputs.modified == 'true'
        run: |
          set -euo pipefail
          az aks update -g rg-studojo -n studojo-aks \
            --api-server-authorized-ip-ranges "${{ steps.aks_allow.outputs.original }}" \
            --only-show-errors -o none
          echo "Restored original authorized IP ranges."