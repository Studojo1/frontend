name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: acrstudojo-dhfsdrfhf6a6bbg2.azurecr.io
  ACR_NAME: acrstudojo
  APP_NAME: frontend
  IMAGE_TAG: ${{ github.sha }}
  NAMESPACE: studojo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          TOKEN=$(az acr login --name ${{ env.ACR_NAME }} --expose-token --output tsv --query accessToken)
          docker login ${{ env.REGISTRY }} -u 00000000-0000-0000-0000-000000000000 -p "$TOKEN"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.APP_NAME }}:latest
          build-args: |
            VITE_PUBLIC_POSTHOG_KEY=${{ secrets.POSTHOG_KEY }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.APP_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.APP_NAME }}:buildcache,mode=max

      - name: Build and push migrate image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: db-push
          tags: |
            ${{ env.REGISTRY }}/${{ env.APP_NAME }}-migrate:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.APP_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.APP_NAME }}:buildcache,mode=max

  migrate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group rg-studojo \
            --name studojo-aks \
            --overwrite-existing

      - name: Apply schema migrations
        env:
          JOB_NAME: frontend-migrate-${{ github.run_id }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.APP_NAME }}-migrate:${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          echo "Running migration job: $JOB_NAME"
          echo "Image: $IMAGE"

          # Substitute placeholders and submit the Job.
          sed \
            -e "s|__JOB_NAME__|$JOB_NAME|g" \
            -e "s|__NAMESPACE__|${{ env.NAMESPACE }}|g" \
            -e "s|__IMAGE__|$IMAGE|g" \
            k8s/migrate-job.yaml | kubectl apply -f -

          # Poll the Job until it reaches a terminal state. We can't just use
          # `kubectl wait --for=condition=complete` because that returns
          # non-zero on timeout AND on failure with identical semantics, and
          # we want to surface failure logs distinctly.
          deadline=$(( $(date +%s) + 900 ))
          while [ $(date +%s) -lt $deadline ]; do
            succeeded=$(kubectl get job "$JOB_NAME" -n ${{ env.NAMESPACE }} -o jsonpath='{.status.succeeded}' 2>/dev/null || true)
            failed=$(kubectl get job "$JOB_NAME" -n ${{ env.NAMESPACE }} -o jsonpath='{.status.failed}' 2>/dev/null || true)

            if [ "$succeeded" = "1" ]; then
              echo "::group::Migration logs"
              kubectl logs "job/$JOB_NAME" -n ${{ env.NAMESPACE }} --tail=500 || true
              echo "::endgroup::"
              echo "Migrations succeeded."
              exit 0
            fi

            if [ -n "$failed" ] && [ "$failed" != "0" ]; then
              echo "::error::Migration job failed (failed=$failed). Deploy will not proceed."
              echo "::group::Migration logs"
              kubectl logs "job/$JOB_NAME" -n ${{ env.NAMESPACE }} --tail=500 || true
              echo "::endgroup::"
              exit 1
            fi

            sleep 5
          done

          echo "::error::Migration job did not finish within 15 minutes."
          echo "::group::Migration logs (timeout)"
          kubectl logs "job/$JOB_NAME" -n ${{ env.NAMESPACE }} --tail=500 || true
          echo "::endgroup::"
          exit 1

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group rg-studojo \
            --name studojo-aks \
            --overwrite-existing

      - name: Ensure emailer internal secret
        run: |
          # Service-to-service secret for the emailer's gated routes (email
          # preferences proxy, events). Must match the emailer's INTERNAL_SECRET,
          # which is sourced from the same EMAILER_INTERNAL_SECRET GitHub secret.
          # No-op when unchanged, so it only triggers a rollout when the value moves.
          kubectl set env deployment/${{ env.APP_NAME }} -n ${{ env.NAMESPACE }} \
            EMAILER_INTERNAL_SECRET="${{ secrets.EMAILER_INTERNAL_SECRET }}"

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/${{ env.APP_NAME }} \
            ${{ env.APP_NAME }}=${{ env.REGISTRY }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }} \
            -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/${{ env.APP_NAME }} \
            -n ${{ env.NAMESPACE }} --timeout=10m || {
            echo "Rollout failed or timed out. Checking pod status..."
            kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.APP_NAME }} -o wide
            LATEST_POD=$(kubectl get pods -n ${{ env.NAMESPACE }} \
              -l app=${{ env.APP_NAME }} \
              --sort-by=.metadata.creationTimestamp \
              -o jsonpath='{.items[-1].metadata.name}' 2>/dev/null || echo "")
            if [ -n "$LATEST_POD" ]; then
              kubectl get events -n ${{ env.NAMESPACE }} \
                --field-selector involvedObject.name=$LATEST_POD \
                --sort-by='.lastTimestamp' | tail -20 || true
              kubectl logs -n ${{ env.NAMESPACE }} $LATEST_POD --tail=50 || true
            fi
            exit 1
          }

      - name: Record deployment
        run: |
          curl -X POST https://api.studojo.com/v1/dev/deployments \
            -H "Content-Type: application/json" \
            -H "X-Deployment-Secret: ${{ secrets.DEPLOYMENT_SECRET }}" \
            -d '{
              "service": "${{ env.APP_NAME }}",
              "version": "${{ env.IMAGE_TAG }}",
              "deployed_at": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'",
              "deployed_by": "${{ github.actor }}",
              "status": "success",
              "workflow_run": ${{ github.run_id }}
            }' || echo "Failed to record deployment (non-critical)"