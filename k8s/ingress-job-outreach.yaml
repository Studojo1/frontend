# Exported from the live cluster. Public route into job-outreach-svc.
# The configuration-snippet blanks X-User-Id and x-studojo-internal so no
# client on the internet can supply them; only our own servers send them,
# in-cluster. Not applied by any workflow: kubectl apply -f <this file>.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: job-outreach-ingress
  namespace: studojo
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-User-Id "";
      proxy_set_header x-studojo-internal "";
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-read-timeout: '600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '600'
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
spec:
  ingressClassName: nginx
  rules:
  - host: api.studojo.com
    http:
      paths:
      - backend:
          service:
            name: job-outreach-svc
            port:
              number: 8000
        path: /job-outreach(/|$)(.*)
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - api.studojo.com
    secretName: studojo-tls-secret
