# Staging twin of ingress-api-outreach.yaml (studojo.pro). Mirrors the live
# staging-api-outreach-ingress, which was applied by hand and had no manifest.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: staging-api-outreach-ingress
  namespace: staging
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/rewrite-target: /api/v1/$2
    # See ingress-api-outreach.yaml: never let a client supply these.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-User-Id "";
      proxy_set_header x-studojo-internal "";
spec:
  ingressClassName: nginx
  rules:
  - host: studojo.pro
    http:
      paths:
      - path: /api/v1/outreach(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: job-outreach-svc
            port:
              number: 8000
  tls:
  - hosts:
    - studojo.pro
    secretName: studojo-pro-tls-secret
