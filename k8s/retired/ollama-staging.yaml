# Retired: the staging Ollama backend, removed 2026-09-28.
#
# These objects were applied by hand in March 2026 and existed in no repo, so
# this file is the only record of them. Captured from the live cluster with
# kubectl immediately before deletion.
#
# The ollama-models PVC in staging was deliberately kept and is not described here.
#
# Restore with:  kubectl apply -f k8s/retired/ollama-staging.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: "5"
  name: ollama
  namespace: staging
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: ollama
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-06-02T17:17:29+05:30"
      labels:
        app: ollama
    spec:
      containers:
      - env:
        - name: OLLAMA_MAX_LOADED_MODELS
          value: "1"
        image: ollama/ollama:latest
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/tags
            port: 11434
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 1
        name: ollama
        ports:
        - containerPort: 11434
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/tags
            port: 11434
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: "2"
            memory: 5Gi
          requests:
            cpu: 500m
            memory: 2Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /root/.ollama
          name: ollama-models
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - sh
        - -c
        - ollama serve & SERVER_PID=$!; sleep 5; ollama pull llama3.2:1b; kill $SERVER_PID
          2>/dev/null; exit 0
        env:
        - name: OLLAMA_MODELS
          value: /root/.ollama/models
        image: ollama/ollama:latest
        imagePullPolicy: Always
        name: pull-model
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /root/.ollama
          name: ollama-models
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: ollama-models
        persistentVolumeClaim:
          claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: staging
spec:
  ports:
  - port: 11434
    protocol: TCP
    targetPort: 11434
  selector:
    app: ollama
  type: ClusterIP
